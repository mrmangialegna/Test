apiVersion: apps/v1
kind: StatefulSet
metadata: 
  name: dbpro
  namespace: orderhub-pro
spec:
  replicas: 1
  serviceName: dbpro-svc
  selector:
    matchLabels:
      app: dbpro
  template:
    metadata:
      labels:
        app: dbpro

    spec:

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000  
        seccompProfile:
          type: RuntimeDefault

      containers:
      - name: postgres
        image: postgres:15

        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]

        ports:
        - containerPort: 5432
        
        resources:
          requests:
            memory: 64Mi
            cpu: 100m
          limits:
            memory: 256Mi
            cpu: 250m
            
        volumeMounts:
          - name: shared-logs
            mountPath: /var/log/postgres
          - name: datadb
            mountPath: /var/lib/postgresql/data
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: orderhub-pro-secret
              key: dbpassword
        - name: POSTGRES_USER
          valueFrom: 
            configMapKeyRef:
              name: orderhubpro-cm
              key: db_usr
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: orderhubpro-cm
              key: db_name
   
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
          initialDelaySeconds: 10
          periodSeconds: 5
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
          initialDelaySeconds: 10
          periodSeconds: 5

      - name: log-rotator
        image: busybox:1.36
        command:
        - /bin/sh
        - -c
        - |
          while true; do
            if [ -f /var/log/postgres/pg.log ] && [ $$(stat -c%s /var/log/postgres/pg.log) -gt 1024000 ]; then
              mv /var/log/postgres/pg.log "/var/log/postgres/pg.log.$$(date +%Y%m%d%H%M%S)"
              touch /var/log/postgres/pg.log
            fi
            sleep 30
          done

        volumeMounts:
        - name: shared-logs
          mountPath: /var/log/postgres

        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"] 

        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 128Mi
            cpu: 100m 

      volumes:
      - name: shared-logs
        emptyDir: {}
      - name: datadb
        persistentVolumeClaim:
          claimName: datadb  
