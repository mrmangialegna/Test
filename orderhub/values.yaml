# Default values for orderhub Helm chart.
# Override with: helm install orderhub . -f my-values.yaml -n orderhub-staging --create-namespace

nameOverride: ""
fullnameOverride: ""

namespace:
  create: true
  name: orderhub-staging
  labels:
    istio.io/rev: default

impulse:
  name: orderhub-impulse
  port: 8080
  image: 
    repository: 192.168.0.23:5000/orderhub-impulse
    tag: ${{ github.sha }}
  resources:
    requests:
      memory: 64Mi
      cpu: 100m
    limits:
      memory: 128Mi
      cpu: 200m

frontend:
  serviceAccount:
    create: true
    name: orderhub-frontend
  replicas: 1
  image:
    repository: 192.168.0.23:5000/orderhub-frontend
    tag: 36e150eef20ffc2d638f287f41c457c1e3584529
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: 64Mi
      cpu: 100m
    limits:
      memory: 128Mi
      cpu: 200m
  port: 80
  readinessProbe:
    path: /
    port: 80
    initialDelaySeconds: 5
    periodSeconds: 5
  service:
    type: ClusterIP
    port: 80
    targetPort: 80

backend:
  replicas: 1
  canary:
    enabled: true
    replicas: 1
    image: {}
  image:
    repository: 192.168.0.23:5000/orderhub-backend
    tag: 36e150eef20ffc2d638f287f41c457c1e3584529
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: 128Mi
      cpu: 125m
    limits:
      memory: 256Mi
      cpu: 250m
  port: 80
  readinessProbe:
    path: /
    port: 80
    initialDelaySeconds: 5
    periodSeconds: 5
  livenessProbe:
    path: /
    port: 80
    initialDelaySeconds: 10
    periodSeconds: 10
  service:
    type: ClusterIP
    port: 80
    targetPort: 80

database:
  replicas: 1
  image:
    repository: postgres
    tag: "15"
    pullPolicy: IfNotPresent
  initContainer:
    image: busybox
    pullPolicy: IfNotPresent
  storage: 1Gi
  storageClassName: ""
  pvc:
    name: pgdata
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 256Mi
  port: 5432
  service:
    port: 5432
    targetPort: 5432
  probes:
    user: postgres
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 5
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 5

config:
  dbHost: orderhub-db-svc
  dbPort: "5432"
  dbUser: postgres
  dbName: orderhub
  logLevel: info

secret:
  dbPassword: abracadabra

limitRange:
  enabled: true
  name: limrange
  container:
    defaultRequest:
      memory: 128Mi
      cpu: 125m
    default:
      memory: 256Mi
      cpu: 256m
    min:
      memory: 64Mi
      cpu: 50m
    max:
      memory: 1Gi
      cpu: "2"

resourceQuota:
  enabled: true
  name: resquota
  hard:
    requests.cpu: "2"
    requests.memory: 8Gi
    limits.cpu: "20"
    limits.memory: 16Gi

storage:
  enabled: true
  className: proxmox-local
  default: true
  pv:
    enabled: true
    name: orderhub-db-pv
    hostPath: /mnt/data/orderhub-db
    size: 1Gi
  pvc:
    enabled: true
    name: pgdata
    size: 1Gi

peerauth:
  name: default
  mode: PERMISSIVE

destrule:
  name: orderhub-backend-dr
  subsetname1: v1
  subsetname2: v2
  tcpmax: 50
  httpmax: 30
  attempts: 3

virtualservice:
  name: orderhub-backend-vs
  weight1: 90
  weight2: 10

authpolicy:
  name: backend-auth
  action: "ALLOW"

promtail:
  enabled: true
  name: promtail
  image:
    repository: grafana/promtail
    tag: 2.9.0
    pullPolicy: IfNotPresent
  lokiUrl: http://loki:3100/loki/api/v1/push

promtailconfig:
  name: promtail-config

servicemonitor:
  enabled: true
  interval: 15s

podAnnotations:
  sidecar.istio.io/proxyCPULimit: "250m"
  sidecar.istio.io/proxyMemoryLimit: "128Mi"