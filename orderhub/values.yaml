# Default values for orderhub Helm chart.
# Override with: helm install orderhub . -f my-values.yaml -n orderhub-staging --create-namespace
# Ogni risorsa Kubernetes ha la propria sezione esplicita. Nessun flag enabled/create.

namespace:
  name: orderhub-staging
  labels:
    istio.io/rev: default

# --- Impulse ---
impulse:
  name: orderhub-impulse
  replicas: 1
  image:
    repository: 192.168.0.23:5000/orderhub-impulse
    tag: e9b778651fbd35332921c7277cd5a900746e9666
    pullPolicy: Always
  port: 8000
  resources:
    requests:
      memory: 64Mi
      cpu: 100m
    limits:
      memory: 128Mi
      cpu: 200m

impulseService:
  name: impulse-service
  type: ClusterIP
  selector: orderhub-impulse
  ports:
    - name: metrics
      port: 8000
      targetPort: 8000

impulseServiceMonitor:
  name: orderhub-impulse-monitor
  labels:
    app: orderhub-impulse
  selector:
    app: orderhub-impulse
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s

# --- Frontend ---
frontend:
  name: orderhub-frontend
  replicas: 1
  image:
    repository: 192.168.0.23:5000/orderhub-frontend
    tag: 3ede59d864aefa77544deef7fdb469ec2c7e9df9
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: 64Mi
      cpu: 100m
    limits:
      memory: 128Mi
      cpu: 200m
  port: 80
  readinessProbe:
    path: /
    port: 80
    initialDelaySeconds: 5
    periodSeconds: 5
  serviceAccountName: orderhub-frontend

frontendServiceAccount:
  name: orderhub-frontend

frontendService:
  name: orderhub-frontend-svc
  type: ClusterIP
  selector: orderhub-frontend
  port: 80
  targetPort: 80

# --- Backend ---
backend:
  name: orderhub-backend
  replicas: 1
  version: v1
  image:
    repository: 192.168.0.23:5000/orderhub-backend
    tag: 3ede59d864aefa77544deef7fdb469ec2c7e9df9
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: 128Mi
      cpu: 125m
    limits:
      memory: 256Mi
      cpu: 250m
  port: 80
  readinessProbe:
    path: /
    port: 80
    initialDelaySeconds: 5
    periodSeconds: 5
  livenessProbe:
    path: /
    port: 80
    initialDelaySeconds: 10
    periodSeconds: 10
  configMapName: orderhub-config
  secretName: orderhub-secret

backendService:
  name: orderhub-backend-svc
  type: ClusterIP
  selector: orderhub-backend
  port: 80
  targetPort: 80

# --- Database ---
database:
  name: orderhub-db
  replicas: 1
  image:
    repository: postgres
    tag: "15"
    pullPolicy: IfNotPresent
  initContainer:
    image: busybox
    pullPolicy: IfNotPresent
  port: 5432
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 256Mi
  probes:
    user: postgres
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 5
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 5
  pvcClaimName: pgdata
  secretName: orderhub-secret
  configMapName: orderhub-config
  serviceName: orderhub-db-svc

databaseService:
  name: orderhub-db-svc
  selector: orderhub-db
  port: 5432
  targetPort: 5432

# --- Config / Secret ---
configMap:
  name: orderhub-config
  dbHost: orderhub-db-svc
  dbPort: "5432"
  dbUser: postgres
  dbName: orderhub
  logLevel: info

secret:
  name: orderhub-secret
  dbPassword: abracadabra

# --- Quota / Limits ---
limitRange:
  name: limrange
  container:
    defaultRequest:
      memory: 128Mi
      cpu: 125m
    default:
      memory: 256Mi
      cpu: 256m
    min:
      memory: 64Mi
      cpu: 50m
    max:
      memory: 1Gi
      cpu: "2"

resourceQuota:
  name: resquota
  hard:
    requests.cpu: "2"
    requests.memory: 8Gi
    limits.cpu: "20"
    limits.memory: 16Gi

# --- Storage ---
storageClass:
  name: proxmox-local
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
  provisioner: kubernetes.io/no-provisioner
  volumeBindingMode: WaitForFirstConsumer
  reclaimPolicy: Retain

persistentVolume:
  name: orderhub-db-pv
  size: 1Gi
  accessModes:
    - ReadWriteOnce
  reclaimPolicy: Retain
  storageClassName: proxmox-local
  hostPath: /mnt/data/orderhub-db
  hostPathType: DirectoryOrCreate
  labels:
    app: orderhub-db

persistentVolumeClaim:
  name: pgdata
  accessModes:
    - ReadWriteOnce
  storageClassName: proxmox-local
  size: 1Gi
  labels:
    app: orderhub-db

# --- Istio ---
peerAuthentication:
  name: default
  mode: PERMISSIVE

destinationRule:
  name: orderhub-backend-dr
  host: orderhub-backend-svc
  subsets:
    - name: v1
      version: v1
    - name: v2
      version: v2
  tcpMaxConnections: 50
  httpMaxPendingRequests: 30
  retryAttempts: 3

virtualService:
  name: orderhub-backend-vs
  host: orderhub-backend-svc
  routes:
    - subset: v1
      weight: 90
    - subset: v2
      weight: 10

authorizationPolicy:
  name: backend-auth
  action: ALLOW
  selector:
    app: orderhub-backend
  principal: cluster.local/ns/orderhub-staging/sa/orderhub-frontend

# --- Promtail ---
promtail:
  name: promtail
  image:
    repository: grafana/promtail
    tag: 2.9.0
    pullPolicy: IfNotPresent
  configMapName: promtail-config
  excludeNodes:
    - registry

promtailServiceAccount:
  name: promtail

promtailRole:
  name: promtail

promtailRoleBinding:
  name: promtail

promtailConfig:
  name: promtail-config
  httpListenPort: 9080
  lokiUrl: http://loki:3100/loki/api/v1/push
  scrapeNamespace: orderhub-staging
  appSelector: 'orderhub-.*'

# --- Monitoring ---
podMonitor:
  name: envoy-stats-monitor
  labels:
    release: prometheus
  interval: 15s
  port: http-envoy-prom
  path: /stats/prometheus

podAnnotations:
  sidecar.istio.io/proxyCPULimit: "250m"
  sidecar.istio.io/proxyMemoryLimit: "128Mi"
