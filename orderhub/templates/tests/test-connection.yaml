apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "orderhub.fullname" . }}-test-connection"
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "orderhub.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ .Values.frontendService.name }}:{{ .Values.frontendService.port }}']
  restartPolicy: Never
