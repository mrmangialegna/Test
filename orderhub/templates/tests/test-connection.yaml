apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "orderhub.fullname" . }}-test-connection"
  namespace: {{ include "orderhub.namespace" . }}
  labels:
    {{- include "orderhub.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['orderhub-frontend-svc:{{ .Values.frontend.service.port }}']
  restartPolicy: Never
