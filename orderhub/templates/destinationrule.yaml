apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{ .Values.destinationRule.name }}
  namespace: {{ .Values.namespace.name }}
spec:
  host: {{ .Values.destinationRule.host }}
  subsets:
  {{- range .Values.destinationRule.subsets }}
  - name: {{ .name }}
    labels:
      version: {{ .version }}
  {{- end }}
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: {{ .Values.destinationRule.tcpMaxConnections }}
      http:
        maxPendingRequests: {{ .Values.destinationRule.httpMaxPendingRequests }}
    retries:
      attempts: {{ .Values.destinationRule.retryAttempts }}
