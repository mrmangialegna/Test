apiVersion: v1
kind: Service
metadata:
  name: orderhub-db-svc
  namespace: {{ include "orderhub.namespace" . }}
  labels:
    {{- include "orderhub.labels" . | nindent 4 }}
    app: orderhub-db
spec:
  clusterIP: None
  selector:
    app: orderhub-db
  ports:
  - port: {{ .Values.database.service.port }}
    targetPort: {{ .Values.database.service.targetPort }}
