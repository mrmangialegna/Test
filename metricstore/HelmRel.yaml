apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metricstore-app
  namespace: metricstore
spec:
  interval: 5m
  chart:
    spec:
      chart: metricstore-app
      version: "1.0.0"
      sourceRef:
        kind: HelmRepository
        name: metricstore-helm-repo
        namespace: metricstore
  values:
    replicaCount: 2
    image:
      tag: "2.1"