apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.servicefrt.name }}
  namespace: {{ .Values.namespace.name }}
spec:
  type: {{ .Values.servicefrt.type }}
  selector:
    app: {{ .Values.frontend.name }}
  ports:
  - port: {{ .Values.servicefrt.port }}
    targetPort: {{ .Values.servicefrt.tport }}