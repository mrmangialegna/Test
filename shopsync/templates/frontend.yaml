apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.frontend.name }}
  namespace: {{ .Values.namespace.name }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.frontend.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.frontend.name }}
    spec:
      containers:
      - name: {{ .Values.frontend.name }}
        image: {{ .Values.frontend.image }}
        ports:
        - containerPort: {{ .Values.frontend.port }}
        resource:
          limits:
            memory: {{ .Values.frontend.rlm }}
            cpu: {{ .Values.frontend.rlc }}
          requests:
            memory: {{ .Values.frontend.rrm }}
            cpu: {{ .Values.frontend.rrc }}
        livenessProbe:
          httpGet:
            path: /path
            port: {{ .Values.frontend.port}}
          
        readinessProbe:
          httpGet:
            path: /ready
            port: {{ .Values.frontend.port}}

        securityContext:
            runAsNonRoot: true
            allowPriviledgeEscalation: false
            capabilites:
              drop: ["ALL"]  
              
        
          