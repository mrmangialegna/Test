{{- if .Values.networkPolicy.backend.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netpol-backend
  namespace: {{ include "tradex.namespace" . }}
  labels:
    {{- include "tradex.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: tradex-backend
  policyTypes:
  - Egress
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: tradex-frontend
    ports:
    - protocol: TCP
      port: {{ .Values.backend.port }}
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: tradex-db
    ports:
    - protocol: TCP
      port: {{ .Values.database.port }}
{{- end }}
