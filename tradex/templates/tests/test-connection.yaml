apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "tradex.fullname" . }}-test-connection"
  namespace: {{ include "tradex.namespace" . }}
  labels:
    {{- include "tradex.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['tradex-frontend-svc:{{ .Values.frontend.service.port }}']
  restartPolicy: Never
