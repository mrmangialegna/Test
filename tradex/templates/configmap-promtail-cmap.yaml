{{- if .Values.promtail.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.promtail.name }}
  namespace: {{ include "tradex.namespace" . }}
  labels:
    {{- include "tradex.labels" . | nindent 4 }}
data:
  promtail-config.yaml: |
    server:
      http_listen_port: {{ .Values.promtail.listenPort }}

    clients:
      - url: {{ .Values.promtail.lokiUrl }}

    scrape_configs:
      - job_name: {{ .Values.promtail.jobName }}
        kubernetes_sd_configs:
          - role: pod

        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app

    pipeline_stages:
      - match:
          selector: '{app=~"tradex-.*"}'
          stages:
            - docker: {}
            - regex:
                expression: '.*(?P<level>ERROR|WARN|INFO|DEBUG).*'
            - labels:
                level: level
{{- end }}
