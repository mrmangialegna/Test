name: Build and Push Backend Images

concurrency:
  group: build-backend
  cancel-in-progress: true

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        project:   # seguendo questo schema project.name, possiamo aggiungere
          - name: orderhub #tutti i progetti che vogliamo
            context: orderhub/docker/backend
            dockerfile: orderhub/docker/backend/back
            image: 192.168.0.23:5000/orderhub-backend
            values: orderhub/values.yaml
          - name: logstream
            context: logstream/docker/backend
            dockerfile: logstream/docker/backend/backend
            image: 192.168.0.23:5000/aggregator
            values: logstream/values.yaml
# la logica della matrice sostituisce ogni volta cio' che e' stato modificato
# nei progetti

    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.project.context }}
          file: ${{ matrix.project.dockerfile }}
          push: true
          tags: ${{ matrix.project.image }}:${{ github.sha }}

      - name: Update values.yaml with new tag
        run: |
          sed -i "s|tag:.*|tag: ${{ github.sha }}|" ${{ matrix.project.values }}
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add orderhub/values.yaml
          git commit -m "Update backend image tag to ${{ github.sha }}"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            git stash pop 2>/dev/null || true
            git add ${{ matrix.project.values }}
          git commit -m "Update ${{ matrix.project.name }} backend tag to ${{ github.sha }}" || true            git push origin main && break
            sleep 3
          done