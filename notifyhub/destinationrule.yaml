apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: notify-svc-dr
  namespace: notify-hub
spec:
  host: notify-svc
  subsets:
  - name: v1
    labels:
      version: v1  
  - name: v2
    labels:
      version: v2
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 50
      http:
        maxPendingRequests: 30
    retries:
      attempts: 3
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50